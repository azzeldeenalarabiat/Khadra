services:
  postgres:
    image: postgres:18-alpine
    container_name: khadra-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-khadra}
      POSTGRES_USER: ${POSTGRES_USER:-khadra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - khadra_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-khadra} -d ${POSTGRES_DB:-khadra}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: khadra-redis
    # noeviction: a BFF session must never be silently dropped under memory pressure.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - khadra_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: khadra-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI: http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  khadra_pgdata:
  khadra_redisdata:
