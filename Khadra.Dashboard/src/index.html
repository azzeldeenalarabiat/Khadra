<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Khadra Admin Console</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <!-- The Khadra mark. A 32px PNG rather than the old .ico: the logo is a circle on transparency
         and every browser in this decade takes a PNG favicon. The larger sizes are for a browser or
         phone that wants one for a bookmark or a home-screen tile. -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="khadra-logo-128.png" />
    <link rel="apple-touch-icon" href="khadra-logo-128.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
