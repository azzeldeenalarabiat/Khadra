<div class="topbar">
  <div class="grow">
    <nav class="topbar-crumbs" aria-label="Breadcrumb">
      @for (crumb of crumbs(); track $index) {
        @if ($index > 0) {
          <span aria-hidden="true">/</span>
        }
        @if (crumb.last) {
          <span class="crumb is-last" aria-current="page">{{ crumb.label }}</span>
        } @else {
          <a class="crumb" [routerLink]="crumb.route">{{ crumb.label }}</a>
        }
      }
    </nav>
    <div class="topbar-title">{{ title() }}</div>
  </div>

  <!--
    The design also puts a platform-wide search box, a reporting-period picker and a notification
    count up here. All three are gone with the sample data: there is no search endpoint, nothing
    reads a reporting period, and the "9" beside the bell was a number that was never counted. A
    control that does nothing when clicked costs an administrator more than a missing one does.
  -->
  <!--
    The account menu.

    This was a dead button with a caret promising a menu, then a plain label once the button was
    removed, because there was no account screen to send anyone to. There is one now, so the caret
    is honest again and the chip opens the two things it always looked like it should.
  -->
  <div class="topbar-actions">
    <kh-notifications />

    <div class="user-menu">
      <button
        type="button"
        class="user-chip"
        [attr.aria-expanded]="open()"
        aria-haspopup="menu"
        [attr.aria-label]="'Account menu for ' + name()"
        (click)="toggle($event)"
      >
        <span class="avatar avatar-26" aria-hidden="true">{{ initials() }}</span>
        <kh-icon name="caret-down" />
      </button>

      @if (open()) {
        <div class="user-menu-panel" role="menu">
          <div class="user-menu-head">
            <div class="sidebar-user-name">{{ name() }}</div>
            <div class="sidebar-user-role">{{ email() }}</div>
          </div>
          <a class="sidebar-link" role="menuitem" [routerLink]="accountRoute()" (click)="close()">
            <kh-icon name="shield-check" />
            Your account
          </a>
          <button type="button" class="sidebar-link" role="menuitem" (click)="signOut()">
            <kh-icon name="sign-out" />
            Sign out
          </button>
        </div>
      }
    </div>
  </div>
</div>
