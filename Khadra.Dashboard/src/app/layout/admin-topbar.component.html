<div class="topbar">
  <div class="grow">
    <nav class="topbar-crumbs" aria-label="Breadcrumb">
      @for (crumb of crumbs(); track $index) {
        @if ($index > 0) {
          <span aria-hidden="true">/</span>
        }
        @if (crumb.last) {
          <span class="crumb is-last" aria-current="page">{{ crumb.label }}</span>
        } @else {
          <a class="crumb" [routerLink]="crumb.route">{{ crumb.label }}</a>
        }
      }
    </nav>
    <div class="topbar-title">{{ title() }}</div>
  </div>

  <!--
    The design also puts a platform-wide search box, a reporting-period picker and a notification
    count up here. All three are gone with the sample data: there is no search endpoint, nothing
    reads a reporting period, and the "9" beside the bell was a number that was never counted. A
    control that does nothing when clicked costs an administrator more than a missing one does.
  -->
  <!--
    The chip names who is signed in; it is not a button.

    It was one, with a caret-down promising a menu and no handler behind it, which is the very thing
    the note above says costs an administrator more than a missing control does. The account actions
    it seemed to promise are in the sidebar footer, where they work. When there is something to put
    here -- the language switcher the frontend rules still list as outstanding -- it becomes a
    control again, with the menu it implies.
  -->
  <div class="topbar-actions">
    <span class="user-chip">
      <span class="avatar avatar-26" aria-hidden="true">{{ initials() }}</span>
      <span class="visually-hidden">Signed in as {{ name() }}</span>
    </span>
  </div>
</div>
