<div class="sidebar">
  <div class="sidebar-head">
    <div class="sidebar-mark">
      <kh-icon name="steering-wheel" />
    </div>
    <div>
      <div class="sidebar-brand">CAR RENTAL<br />SYSTEM</div>
      @if (isDealer()) {
        <div class="sidebar-caption">Dealer</div>
      }
    </div>
  </div>

  <nav class="sidebar-nav" aria-label="Admin sections">
    @for (group of groups(); track $index) {
      @if (group.group) {
        <div class="nav-group">{{ group.group }}</div>
      }
      @for (item of group.items; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <kh-icon [name]="item.icon" class="nav-item-icon" />
          <span class="nav-item-label">{{ item.label }}</span>
          @if (badge(item.count); as n) {
            <span class="nav-badge">{{ n }}</span>
          }
        </a>
      }
    }
  </nav>

  <div class="sidebar-foot">
    <!-- Who is signed in, and the way to their own account. It was a static block that looked
         exactly like the clickable row above it and did nothing when clicked. -->
    <a class="sidebar-user" [routerLink]="accountRoute()" routerLinkActive="is-active">
      <div class="avatar avatar-28">{{ initials() }}</div>
      <div class="grow">
        <div class="sidebar-user-name">{{ name() }}</div>
        <div class="sidebar-user-role">{{ role() }}</div>
      </div>
      <kh-icon name="caret-right" />
    </a>
    <!-- "Account settings" stood here as a button with no handler: it looked like the way to change
         your own password and did nothing at all when clicked. There is no account screen to send it
         to either -- Security and Admin users are both in the rail already, and both say they are
         not built -- so routing it there would be the same dead click at the end of a longer path.
         It comes back with the screen, not before. -->
    <button type="button" class="sidebar-link" (click)="signOut()">
      <kh-icon name="sign-out" />
      Logout
    </button>
  </div>
</div>
