@if (toast(); as shown) {
  <div class="toast" [class]="toneClass(shown.tone)" role="status" aria-live="polite">
    <kh-icon [name]="icon(shown.tone)" class="toast-icon" />
    <div>
      <div class="toast-title">{{ shown.title }}</div>
      <div class="toast-body">{{ shown.body }}</div>
    </div>
    <button type="button" class="btn btn-ghost btn-xs" (click)="dismiss()">{{ t('toast.dismiss') }}</button>
  </div>
}
