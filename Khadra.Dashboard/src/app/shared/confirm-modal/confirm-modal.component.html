<dialog
  #dlg
  class="dialog-backdrop"
  (cancel)="cancel($event)"
  (close)="close()"
  (click)="backdropClick()"
>
  @if (modal(); as m) {
    <div class="dialog" [attr.aria-label]="m.title" (click)="$event.stopPropagation()">
      <div class="row row-gap-12" [class]="toneClass(m.tone)">
        <div class="modal-icon-wrap">
          <kh-icon [name]="m.icon" />
        </div>
        <div class="grow">
          <div class="dialog-title user-text">{{ m.title }}</div>
          <div class="dialog-body user-text">{{ m.body }}</div>
        </div>
        <button
          type="button"
          class="btn btn-icon btn-secondary btn-28"
          [attr.aria-label]="t('common.close')"
          (click)="close()"
        >
          <kh-icon name="x" />
        </button>
      </div>

      @for (field of m.fields ?? []; track field.name) {
        <div class="field">
          <label [attr.for]="'modal-field-' + $index">{{ field.label }}</label>
          @if (field.type === 'select') {
            <select
              class="input"
              [id]="'modal-field-' + $index"
              (change)="setField(field.name, $event)"
            >
              <!-- The VALUE is what the caller reads back; the label is only what is read. -->
              @for (option of field.options ?? []; track option.value) {
                <option
                  [value]="option.value"
                  [selected]="option.value === (field.value ?? field.options?.[0]?.value)"
                >
                  {{ option.label }}
                </option>
              }
            </select>
          } @else if (field.type === 'password') {
            <!-- Masked and single-line. A textarea here would show the password to the room. -->
            <input
              class="input"
              type="password"
              autocomplete="off"
              [id]="'modal-field-' + $index"
              [placeholder]="field.placeholder ?? ''"
              (input)="setField(field.name, $event)"
            />
          } @else {
            <textarea
              class="input"
              [id]="'modal-field-' + $index"
              [placeholder]="field.placeholder ?? ''"
              [value]="field.value ?? ''"
              (input)="setField(field.name, $event)"
            ></textarea>
          }
          @if (field.hint) {
            <div class="field-hint">{{ field.hint }}</div>
          }
        </div>
      }

      @if (m.note) {
        <div class="modal-note" [class]="toneClass(m.tone)">
          <kh-icon name="info" />
          <span>{{ m.note }}</span>
        </div>
      }

      <div class="dialog-actions">
        <button
          type="button"
          class="btn btn-secondary btn-md"
          autofocus
          [disabled]="busy()"
          (click)="close()"
        >
          {{ t('common.cancel') }}
        </button>
        <button
          type="button"
          class="btn btn-md"
          [class.btn-primary]="!m.danger"
          [class.btn-danger]="m.danger"
          [disabled]="busy() || !canConfirm()"
          (click)="confirm()"
        >
          {{ busy() ? t('common.working') : m.confirm }}
        </button>
      </div>
    </div>
  }
</dialog>
