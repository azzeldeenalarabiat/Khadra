<div class="stack stack-14 page-narrow">
  <div class="page-head">
    <div>
      <h1 class="page-title">Notifications</h1>
      <div class="page-sub">
        9 unread across dealer approval, disputes, payments, payouts, security and system
      </div>
    </div>
    <button type="button" class="btn btn-secondary btn-md push">Mark all as read</button>
  </div>

  <div class="notif-cats">
    @for (category of categories; track category.label) {
      <button
        type="button"
        class="btn btn-xs"
        [class.btn-primary]="activeCategory() === category.label"
        [class.btn-secondary]="activeCategory() !== category.label"
        (click)="select(category.label)"
      >
        <kh-icon [name]="category.icon" />
        {{ category.label }}
        <span class="notif-count">{{ category.count }}</span>
      </button>
    }
  </div>

  <section class="sect sect-clip">
    @for (item of items; track item.title) {
      <div class="notif-row" [class.is-unread]="item.unread" [class]="toneClass(item.tone)">
        <div class="notif-icon-wrap">
          <kh-icon [name]="item.icon" />
        </div>
        <div class="grow">
          <div class="row row-gap-8">
            <span class="notif-title">{{ item.title }}</span>
            @if (item.unread) {
              <span class="notif-dot" aria-label="Unread"></span>
            }
            <span class="notif-ts">{{ item.ts }}</span>
          </div>
          <div class="notif-desc">{{ item.desc }}</div>
        </div>
        <a class="btn btn-ghost btn-xs" [routerLink]="item.route">{{ item.link }}</a>
      </div>
    }
  </section>
</div>
