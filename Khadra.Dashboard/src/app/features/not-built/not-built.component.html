<div class="stack stack-14 page-mid">
  <div class="dc-head">
    <div>
      <h1 class="page-title">{{ t(copy().titleKey) }}</h1>
      <div class="page-sub">{{ t('notBuilt.badge') }}</div>
    </div>
  </div>

  <section class="sect">
    <div class="state-block is-empty">
      <div class="state-icon is-outline"><kh-icon [name]="copy().icon" /></div>
      <div class="state-title">{{ t('notBuilt.noData') }}</div>
      <div class="state-text">{{ t(copy().purposeKey) }}</div>

      <div class="note-box is-plain">
        <kh-icon name="info" />
        {{ t(copy().blockedKey) }}
      </div>

      @if (copy().instead; as instead) {
        <div class="state-text">{{ t(instead.textKey) }}</div>
        <div class="state-actions">
          <a class="btn btn-secondary btn-sm" [routerLink]="instead.route">{{ t(instead.labelKey) }}</a>
        </div>
      }
    </div>
  </section>
</div>
