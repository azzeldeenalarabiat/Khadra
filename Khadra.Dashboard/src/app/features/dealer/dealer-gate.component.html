@if (locked() && copy(); as block) {
  <div class="locked-wrap">
    <div class="sect locked-card">
      <div class="locked-head" [class]="'s-' + block.tone">
        <div class="locked-icon"><kh-icon [name]="block.icon" /></div>
        <div>
          <div class="locked-title">{{ block.title }}</div>
          <span class="pill" [class]="'s-' + block.tone">{{ block.badge }}</span>
        </div>
      </div>
      <div class="locked-body">{{ block.body }}</div>
      <div class="locked-points">
        <span class="k">{{ block.listTitle }}</span>
        @for (point of block.points; track point.text) {
          <div class="locked-point" [class]="'s-' + point.tone">
            <kh-icon [name]="point.icon" />
            <span>{{ point.text }}</span>
          </div>
        }
      </div>
      <div class="row row-gap-8">
        <a class="btn btn-primary btn-md" routerLink="/dealer/profile">Open my dealer page</a>
        <a class="btn btn-secondary btn-md" routerLink="/dealer/settings">Account settings</a>
      </div>
      <div class="mono">RequireApprovedDealer · enforced server-side on every call</div>
    </div>
  </div>
} @else {
  <router-outlet />
}
