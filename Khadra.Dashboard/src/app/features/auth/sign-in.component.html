<div class="auth-shell">
  <form class="sect auth-card stack stack-14" (ngSubmit)="submit()">
    <div class="auth-head">
      <div class="sidebar-mark"><kh-icon name="steering-wheel" /></div>
      <div class="sidebar-brand">CAR RENTAL<br />SYSTEM</div>
    </div>

    <div>
      <h1 class="auth-title">Sign in</h1>
      <div class="page-sub">Administrator access to the Khadra platform console.</div>
    </div>

    @if (notice(); as problem) {
      <div class="banner" [class]="problem.tone" role="alert">
        <kh-icon name="warning-circle" class="banner-icon" />
        <div class="banner-body">
          <div class="banner-title">{{ problem.title }}</div>
          <div class="banner-text">{{ problem.text }}</div>
        </div>
      </div>
    }

    <div class="field">
      <label for="sign-in-email">Email</label>
      <input
        id="sign-in-email"
        class="input"
        type="email"
        name="email"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
        [disabled]="busy()"
        [value]="email()"
        (input)="email.set(fieldValue($event))"
      />
    </div>

    <div class="field">
      <label for="sign-in-password">Password</label>
      <input
        id="sign-in-password"
        class="input"
        type="password"
        name="password"
        autocomplete="current-password"
        required
        [disabled]="busy()"
        [value]="password()"
        (input)="password.set(fieldValue($event))"
      />
    </div>

    <button type="submit" class="btn btn-primary btn-md btn-block" [disabled]="busy()">
      {{ busy() ? 'Signing in…' : 'Sign in' }}
    </button>

    <div class="auth-foot">
      <a class="auth-link" routerLink="/forgot-password">Forgot password?</a>
    </div>
  </form>
</div>
