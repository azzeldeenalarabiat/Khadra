# Khadra on Render — ONLY the pieces that do not exist yet.
#
# Production already has two things this file must not touch:
#
#   * the API, live at https://khadra.onrender.com as the service `khadra`
#   * Postgres, on SUPABASE — not on Render
#
# So this Blueprint declares the console and the session store, and nothing else.
# An earlier version declared a Render Postgres and a second API; both were
# wrong. A second database would have come up empty while the real one sat on
# Supabase, and a second API would have been a duplicate of a service that is
# already live and working.
#
#     Render dashboard -> New -> Blueprint -> point it at this repository
#
# Render leaves services it does not declare alone, so the existing `khadra`
# service is untouched by syncing this file. Two settings on THAT service still
# need changing by hand once the console exists; they are listed at the bottom.

services:
  # ── The admin console, served by the BFF ───────────────────────────────────
  #
  # ONE service, not two. Khadra.Bff serves the built Angular console from
  # wwwroot and falls back to index.html for client-side routes, so the console
  # is not separately deployable — a Node stage builds it into this image.
  #
  # This is the only thing standing between the platform and a usable web UI:
  # https://khadra.onrender.com is the API, and its root answers 401 because it
  # is an API, not because anything is broken.
  - type: web
    name: khadra-bff
    runtime: docker

    # Free, as asked. Two consequences worth knowing rather than discovering:
    #   * it spins down after 15 minutes without traffic, so the first request
    #     back takes roughly a minute while the container starts;
    #   * no persistent disk, which this service does not need — its state is
    #     the session store below, not the filesystem.
    plan: free

    # MUST match the region the existing `khadra` API runs in, if you use the
    # private address for it below. Check the API service's region in Render and
    # set this to the same one; private networking does not cross regions.
    region: frankfurt

    dockerfilePath: ./Khadra.Bff/Dockerfile
    # The repository ROOT. .NET restore needs global.json, Directory.Build.props,
    # Directory.Packages.props and .editorconfig, none of which live beside the
    # project. Building with this folder as the context fails on the restore.
    dockerContext: .

    envVars:
      # ── Where the existing API lives ──────────────────────────────────────
      #
      # Both keys take the SAME value, and you have a real choice to make:
      #
      #   http://khadra:8080/            private, same region. PREFERRED.
      #   https://khadra.onrender.com/   public, works from anywhere.
      #
      # Prefer the private one. Over the public URL every console request
      # reaches the API from Render's edge, so the API sees one address for the
      # entire console population and every per-address rate limit — including
      # the 10-per-15-minutes brute-force cap on sign-in — becomes one shared
      # budget. Over the private network the API sees this container and honours
      # the X-Forwarded-For the BFF sends, which is the whole point of the chain.
      #
      # The public URL is the fallback if the services are in different regions.
      - key: BffSecurity__ApiBaseUrl
        sync: false
      - key: ReverseProxy__Clusters__webapi__Destinations__primary__Address
        sync: false

      # ── Sessions and the Data Protection key ring ─────────────────────────
      #
      # Wired automatically from the instance below. Render hands this over as a
      # redis:// URL and StackExchange.Redis reads host:port form; the BFF
      # converts it (RedisConnectionString), so either shape works.
      - key: BffSecurity__RedisConnection
        fromService:
          name: khadra-redis
          type: keyvalue
          property: connectionString

      # ── Who the client is ─────────────────────────────────────────────────
      #
      # Not a formality. ForwardedHeadersMiddleware only checks the sender when
      # it has something to check against, so an empty list means "trust
      # anybody" — and here it is worse than that: the session and antiforgery
      # cookies are __Host- prefixed with SecurePolicy.Always, and the
      # antiforgery system REFUSES to issue a token when Request.IsHttps is
      # false. Behind an edge that terminates TLS, IsHttps is false unless
      # X-Forwarded-Proto is honoured. Get this wrong and the console loads
      # perfectly and every sign-in returns 500.
      #
      # The BFF now refuses to start in Production rather than run that way.
      #
      # These three ranges are a starting point, not an answer. Read the API's
      # first-request log line, which names the address the platform actually
      # connects from, and add the range containing it.
      - key: KnownProxies__0
        value: 10.0.0.0/8
      - key: KnownProxies__1
        value: 172.16.0.0/12
      - key: KnownProxies__2
        value: 192.168.0.0/16

      # Counted from the RIGHT. Render fronts services with Cloudflare AND its
      # own load balancer, so one hop may resolve to a platform address rather
      # than a visitor. Raise it if the sessions screen shows the wrong address.
      - key: ForwardedHeaders__ForwardLimit
        value: "1"

  # ── The session store ──────────────────────────────────────────────────────
  #
  # Holds the encrypted session tickets AND the Data Protection key ring, which
  # is what decrypts the session cookie. It is not a cache and losing it is not
  # a performance event: every signed-in person is signed out.
  #
  # FREE INSTANCES DO NOT PERSIST TO DISK. Render's own documentation: "whenever
  # an instance restarts, all of its data is lost." So a restart signs everyone
  # out and they sign in again. Survivable for a console with a handful of
  # administrators, and the reason to move to a paid plan later is this line and
  # not capacity. Render also allows only ONE free Key Value per workspace.
  - type: keyvalue
    name: khadra-redis
    plan: free
    region: frankfurt

    # Nothing outside Render reaches it. It holds session tickets and the key
    # ring unencrypted at rest, so anyone who could connect could mint a session
    # cookie for any account.
    ipAllowList: []

    # A session ticket quietly evicted under memory pressure signs somebody out
    # mid-task and looks like a bug in the application.
    maxmemoryPolicy: noeviction

# ── What still has to be done by hand, on the EXISTING `khadra` API service ──
#
# This Blueprint cannot reach that service, and deliberately does not try.
#
#   App__ClientBaseUrl   Set to the console's full https:// address once
#                        khadra-bff has deployed and Render shows its URL. It is
#                        currently pointing somewhere else, and every link in a
#                        verification, reset or invitation email is a page a
#                        person opens in that console.
#
#   Email__ApiKey        Must be the Brevo HTTP API key beginning 'xkeysib-'.
#                        The key currently set begins 'xsmtpsib-', which is the
#                        SMTP key; the API detects this and refuses it, so no
#                        mail is delivered and no administrator can be invited.
