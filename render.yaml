# Khadra on Render, as a Blueprint.
#
# Written after a deployment configured by hand came up with no database, no
# console, and no schema. Everything below is the same set of settings
# docs/deployment.md describes; the value of having it here is that Render fills
# in the ones that are easy to get wrong — the connection string especially — and
# that a second environment is a copy of this file rather than an afternoon of
# clicking.
#
#     Render dashboard -> New -> Blueprint -> point it at this repository
#
# Two values are deliberately NOT here and Render will prompt for them: the Brevo
# API key and the sender address. Secrets do not belong in a tracked file.

# No `databases:` block. Postgres lives on Supabase, and declaring one here would
# create a SECOND, empty database that nothing uses while the real one sits
# elsewhere -- the kind of thing discovered by wondering why the data disappeared.
# The connection string is prompted for instead; see the note on it below.

services:
  # ── The API ────────────────────────────────────────────────────────────────
  #
  # PUBLIC on purpose. It is not only the BFF's backend: the Flutter customer app
  # holds a bearer token and calls it directly, which is why it is a web service
  # rather than a private one.
  - type: web
    name: khadra-webapi
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Khadra.WebAPI/Dockerfile
    # The repository root, because .NET restore needs global.json,
    # Directory.Build.props, Directory.Packages.props and .editorconfig.
    dockerContext: .
    healthCheckPath: /health/ready

    # The schema, applied before the new version serves traffic and never on
    # startup. Database:AutoMigrate is honoured only in Development by design, and
    # AdminBootstrapper queries `users` while the API boots — so an API that came
    # up before the schema existed would crash-loop.
    preDeployCommand: /app/efbundle

    envVars:
      # Supabase, and it MUST be the SESSION POOLER string, not the direct one.
      #
      #   session pooler  aws-0-<region>.pooler.supabase.com:5432   <- this one
      #   direct          db.<ref>.supabase.co:5432                 <- resolves to
      #                                                                IPv6 ONLY on
      #                                                                the free tier
      #
      # The direct host publishes an AAAA record and no A record unless the paid
      # IPv4 add-on is enabled. Render has no IPv6 outbound, so it cannot resolve or
      # reach it, and the failure reads as a DNS error rather than as anything about
      # addressing. That cost this deployment several days.
      #
      # Not the TRANSACTION pooler on 6543 either: it does not support prepared
      # statements, which Npgsql uses by default and EF migrations rely on.
      #
      # Note the username carries the project ref: postgres.<ref>, not postgres.
      # URL form is fine; the application converts it (PostgresConnectionString).
      - key: ConnectionStrings__DefaultConnection
        sync: false

      # 256 random bits, generated by Render and never seen by anyone. Comfortably
      # over the 32-byte minimum the options validator enforces.
      - key: Authentication__Jwt__SigningKey
        generateValue: true

      # Render fronts every service with Cloudflare AND its own load balancer, so
      # the address on the connection is always theirs. Trusting the private
      # ranges is what lets X-Forwarded-For be believed at all; with none of them
      # the API refuses to start, by design.
      #
      # ForwardLimit is the half that is easy to get wrong quietly. It counts hops
      # from the RIGHT, and Render puts the real visitor FIRST. If the sessions
      # screen shows a platform address rather than a visitor's, raise it by one
      # and redeploy — see docs/deployment.md, which gives the procedure.
      - key: KnownProxies__0
        value: 10.0.0.0/8
      - key: KnownProxies__1
        value: 172.16.0.0/12
      - key: KnownProxies__2
        value: 192.168.0.0/16
      - key: ForwardedHeaders__ForwardLimit
        value: "1"

      # Where emailed links point. The console, not the API: every link in a
      # verification, reset or invitation email is a page a person opens.
      #
      # Entered by hand rather than wired with fromService, and that is not laziness:
      # fromService offers host, port and hostport, none of which carry a scheme. It
      # would yield "khadra-bff.onrender.com", AppOptions validates this with [Url],
      # and a bare hostname is not an absolute URL -- so the API would fail its own
      # startup validation. Render prompts for it; give it the console's full
      # https:// address, which Render shows once khadra-bff has deployed.
      - key: App__ClientBaseUrl
        sync: false

      - key: Email__Provider
        value: Brevo
      # Prompted for on first deploy. A Brevo key is a secret, and the sender has
      # to be an address CONFIRMED on that Brevo account or every message is
      # refused after being accepted.
      - key: Email__ApiKey
        sync: false
      - key: Email__FromAddress
        sync: false

      # Customer identity papers — licences, passports, commercial registrations.
      # A container filesystem is ephemeral, so without the disk below every one
      # of them is gone at the next deploy.
      - key: Documents__RootPath
        value: /var/khadra/documents

    disk:
      name: khadra-documents
      mountPath: /var/khadra
      sizeGB: 5

  # ── The BFF, with the admin console inside it ──────────────────────────────
  #
  # One service, not two: Khadra.Bff serves the built Angular console from wwwroot
  # and falls back to index.html for client-side routes.
  - type: web
    name: khadra-bff
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Khadra.Bff/Dockerfile
    dockerContext: .

    envVars:
      # Reached over Render's private network by service name. This matches the
      # value already sitting in Khadra.Bff/appsettings.json, which named
      # http://khadra-webapi:8080/ long before any of this existed — hence the
      # service being named khadra-webapi and the container listening on 8080.
      - key: BffSecurity__ApiBaseUrl
        value: http://khadra-webapi:8080/
      - key: ReverseProxy__Clusters__webapi__Destinations__primary__Address
        value: http://khadra-webapi:8080/

      # Sessions and the Data Protection key ring. NOT optional and not a cache:
      # lose it and every signed-in person is signed out, because the cookie can
      # no longer be decrypted.
      #
      # Render hands this over as a redis:// URL and StackExchange.Redis reads
      # host:port form — the same mismatch the Postgres URL had. Converted in code
      # (RedisConnectionString), so either form works. Worth knowing it mattered
      # more here: the BFF awaits its Redis connection at startup and treats
      # failure as fatal, so a URL would have crash-looped the console rather than
      # producing one bad endpoint.
      - key: BffSecurity__RedisConnection
        fromService:
          name: khadra-redis
          type: keyvalue
          property: connectionString

      - key: KnownProxies__0
        value: 10.0.0.0/8
      - key: KnownProxies__1
        value: 172.16.0.0/12
      - key: KnownProxies__2
        value: 192.168.0.0/16

  # ── Sessions and the key ring ──────────────────────────────────────────────
  - type: keyvalue
    name: khadra-redis
    plan: starter
    region: frankfurt
    # Nothing outside Render reaches it. It holds session tickets and the Data
    # Protection keys unencrypted at rest; anyone who could connect could mint a
    # session cookie for any account.
    ipAllowList: []
    # noeviction, because a session ticket silently evicted under memory pressure
    # signs somebody out mid-task and looks like a bug in the application.
    maxmemoryPolicy: noeviction
