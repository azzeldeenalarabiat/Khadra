<a class="skip-link" href="#main">{{ i18n.t('nav.skipToContent') }}</a>
<kh-site-header />
<main id="main" class="site-main" tabindex="-1">
  <router-outlet />
</main>
<kh-site-footer />
@if (shortlistRefusal(); as text) {
  <div class="site-toast notice notice--warn" role="status"><kh-icon name="heart" /><p>{{ text }}</p>
    <button type="button" class="icon-btn" [attr.aria-label]="i18n.t('common.close')" (click)="shortlist.dismissRefusal()"><kh-icon name="x" /></button></div>
}
