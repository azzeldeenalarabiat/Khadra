<section class="container page page--narrow auth">
  <div class="card card--pad auth__card">
    <h1>{{ i18n.t('reset.title') }}</h1>
    @if (done()) {
      <div class="notice notice--ok" role="status"><kh-icon name="check-circle" /><p>{{ i18n.t('reset.done') }}</p></div>
      <a class="btn btn--primary btn--block" [routerLink]="i18n.link('login')">{{ i18n.t('signIn.submit') }}</a>
    } @else if (!hasToken) {
      <div class="notice notice--warn" role="status"><kh-icon name="warning" /><p>{{ i18n.t('reset.missingToken') }}</p></div>
      <a class="btn btn--primary btn--block" [routerLink]="i18n.link('forgot-password')">{{ i18n.t('forgot.submit') }}</a>
    } @else {
      <form class="stack" (submit)="submit($event)" novalidate>
        <label class="field">
          <span class="field__label">{{ i18n.t('auth.newPassword') }}</span>
          <span class="input-group">
            <input class="input ltr" [type]="reveal() ? 'text' : 'password'" name="password" autocomplete="new-password" required
              [ngModel]="password()" (ngModelChange)="password.set($event)" />
            <button type="button" class="input-group__btn" (click)="reveal.set(!reveal())" [attr.aria-pressed]="reveal()">
              {{ i18n.t(reveal() ? 'auth.hide' : 'auth.show') }}</button>
          </span>
          @if (passwordHint()) { <span class="field__hint">{{ passwordHint() }}</span> }
        </label>
        <label class="field">
          <span class="field__label">{{ i18n.t('auth.confirmPassword') }}</span>
          <input class="input ltr" [type]="reveal() ? 'text' : 'password'" name="confirm" autocomplete="new-password"
            [ngModel]="confirm()" (ngModelChange)="confirm.set($event)" [attr.aria-invalid]="mismatch()" />
          @if (mismatch()) { <span class="field__error">{{ i18n.t('auth.passwordsDiffer') }}</span> }
        </label>
        @if (message(); as text) {
          <div class="notice notice--bad" role="alert"><kh-icon name="warning-circle" /><p>{{ text }}</p></div>
        }
        <button type="submit" class="btn btn--primary btn--block" [disabled]="busy()">{{ i18n.t('reset.submit') }}</button>
      </form>
    }
  </div>
</section>
