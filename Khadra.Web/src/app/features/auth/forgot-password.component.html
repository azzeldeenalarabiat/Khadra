<section class="container page page--narrow auth">
  <div class="card card--pad auth__card">
    <h1>{{ i18n.t('forgot.title') }}</h1>
    <p class="muted">{{ i18n.t('forgot.subtitle') }}</p>
    <form class="stack" (submit)="submit($event)" novalidate>
      <label class="field">
        <span class="field__label">{{ i18n.t('auth.email') }}</span>
        <input class="input ltr" type="email" name="email" autocomplete="email" inputmode="email" required
          [ngModel]="email()" (ngModelChange)="email.set($event)" />
      </label>
      @if (sent()) {
        <div class="notice notice--ok" role="status"><kh-icon name="check-circle" /><p>{{ i18n.t('forgot.sent') }}</p></div>
      }
      @if (message(); as text) {
        <div class="notice notice--bad" role="alert"><kh-icon name="warning-circle" /><p>{{ text }}</p></div>
      }
      <button type="submit" class="btn btn--primary btn--block" [disabled]="busy()">{{ i18n.t('forgot.submit') }}</button>
    </form>
    <div class="auth__links"><a class="link" [routerLink]="i18n.link('login')">{{ i18n.t('signIn.submit') }}</a></div>
  </div>
</section>
