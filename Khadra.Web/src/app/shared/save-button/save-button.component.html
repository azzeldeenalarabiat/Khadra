@if (session.isResolved()) {
  <button type="button" class="save-btn" [class.is-saved]="saved()" [class.is-popping]="justSaved() && saved()" [attr.aria-pressed]="saved()"
    [disabled]="busy()" [attr.aria-label]="i18n.t(saved() ? 'car.unsave' : 'car.save')" (click)="toggle($event)">
    <kh-icon [name]="saved() ? 'heart-fill' : 'heart'" />
  </button>
}
