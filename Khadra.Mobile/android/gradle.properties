# 3G, not 8G. A daemon told it may take 8G of heap plus 4G of metaspace asks
# for more than a 8GB machine HAS, and the JVM does not fail politely when the
# address space runs out -- it dies mid-build with "Gradle build daemon
# disappeared unexpectedly", which reads like a Gradle bug rather than a
# setting. These numbers build this project with room for an emulator beside it.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
