name: khadra_mobile
description: "Khadra — rent a car in Jordan from licensed rental offices."
publish_to: 'none'
# 1.1.0 is the first build that reads the office's own texts as { text, language } and
# sends X-Khadra-App-Version. The API refuses anything older (MobileApp:MinimumSupportedVersion
# in Khadra.WebAPI/appsettings.json), and MobileAppMinimumVersionTests fails if that minimum is
# ever raised above this line — raise this first.
#
# 1.2.0 shows the handover code and registers for push. Additive to the API, so the minimum stays
# 1.1.0 until Handover:RequireVerification is switched on — which raises it to 1.2.0 in the same
# step, AFTER this build is published (docs/production.md, "The customer app").
version: 1.2.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State. Riverpod rather than Bloc because this app is read-heavy over state the
  # SERVER owns: AsyncValue forces the loading/error/data branches at every call
  # site, and there are no client-side invariants for a reducer to protect. Bloc's
  # event -> reducer shape actively invites the thing to avoid here, which is
  # emitting a new status from local knowledge instead of from the server's answer.
  flutter_riverpod: ^2.6.1

  # HTTP. Interceptors are what make the single-flight token refresh possible at all.
  dio: ^5.7.0

  # The refresh token, and only the refresh token. Keychain / Keystore backed.
  #
  # HELD IN 10.x on purpose, and the caret is what holds it. v10 deprecates the
  # Jetpack Crypto backend this app has been writing with and carries the
  # migration off it; v11 REMOVES the option, and its changelog says to pass
  # through v10 first or strand what is already stored. The second hop is taken
  # once the first is proven on a device that actually holds a 9.x token --
  # pre-launch item 94.
  flutter_secure_storage: ^10.3.2
  # Per-viewer conveniences that are not secrets: the chosen language, the
  # first-run marker that clears a Keychain entry surviving an app deletion.
  shared_preferences: ^2.3.5

  # Rentals are billed in AMMAN calendar days. A date picker running in the
  # device's zone would price a different number of days, so every calendar
  # calculation goes through this with the zone /app-config names.
  timezone: ^0.10.0
  intl: ^0.20.2

  go_router: ^14.6.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  # The gallery's location, and where a delivery should go. Tiles come from a
  # public raster source; no API key, no billing account.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  # A licence is a photograph; a passport scan emailed by an embassy is a PDF.
  # image_picker cannot open one, and /app-config has advertised application/pdf
  # since the store was configured, so the app was refusing a file the platform
  # accepts. WHICH types are accepted is still the server's answer, never a list
  # held here.
  # 12.x, because 11.x applies its own Kotlin Gradle Plugin and this toolchain's
  # built-in Kotlin no longer links one that does: the Android build failed with
  # `cannot find symbol FilePickerPlugin` and no APK could be produced at all.
  file_picker: ^12.3.0
  # What a file actually IS, read from its leading bytes rather than trusted from
  # its name. A .pdf that is really a JPEG is refused by the server either way;
  # the point is that the app sends the truth about what it is uploading.
  mime: ^2.1.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  # The installed build's own version, sent on every request as X-Khadra-App-Version and compared
  # with the minimum /app-config publishes. Read from the platform rather than typed into a
  # constant, because a constant is a second copy of this file's `version:` that nobody bumps.
  package_info_plus: ^10.2.1
  # The provider's checkout page, INSIDE the app. A customer handed to the external browser has
  # left Khadra mid-payment, and coming back is a task switch they have to find on their own. The
  # page is whatever URL the server minted for the attempt; the app reads nothing from it and
  # learns the outcome from the booking, never from where the page navigates. See CheckoutScreen.
  webview_flutter: ^4.14.1
  # Push notifications (FCM). Each environment is its own Firebase project; a build with no
  # google-services.json runs with push off (see PushMessaging). Foreground pushes are shown
  # through flutter_local_notifications on the same "booking_updates" channel the server names.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^18.0.1
  # The handover code as a QR, for the rental office to scan. Drawn on the phone; no network.
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Already in the tree through flutter_test; named here because `live_refresh_test` imports it
  # directly, to drive the refresh heartbeat without spending real minutes on it.
  fake_async: ^1.3.1

  # Launcher icons. BUILD-TIME ONLY -- neither of these ships in the APK.
  #
  # The icons are generated rather than hand-cut because there are ten of them
  # (five legacy densities and five adaptive foregrounds) and a logo that is
  # redrawn later has to be able to produce all ten again without anybody
  # opening an image editor. `tools/make_launcher_icons.dart` prepares the two
  # source images this then slices; both are regenerated by
  # `dart run tools/make_launcher_icons.dart && dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.3
  image: ^4.3.0

flutter:
  uses-material-design: true
  generate: true

  # Which Khadra a build talks to when no --flavor is given. `production` is the customer app,
  # unchanged: same applicationId, same name, and the API address still passed with
  # --dart-define=KHADRA_API_BASE_URL. The other flavor is `staging` (--flavor staging), a separate
  # "Khadra TEST" app bound to the staging API. See AppEnvironment and docs/production.md.
  default-flavor: production

  assets:
    - assets/brand/

  # The approved design is SET in these. A system UI face is a different typeface
  # on every phone the app runs on, so the design would be approximate everywhere
  # and identical nowhere.
  #
  # Two families, because one cannot do it: Manrope contains no Arabic at all —
  # not one letter, not the Arabic comma — and Noto Kufi Arabic is the face the
  # handoff itself names for Arabic. Flutter falls back per GLYPH, so Manrope
  # sets the Latin and the figures and Kufi catches every Arabic character,
  # including inside a mixed sentence. See KhadraTheme for the ordering, which is
  # load-bearing.
  #
  # Both are SIL Open Font License 1.1, which permits bundling in an application.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Noto Kufi Arabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic-400.ttf
          weight: 400
        - asset: assets/fonts/NotoKufiArabic-500.ttf
          weight: 500
        - asset: assets/fonts/NotoKufiArabic-600.ttf
          weight: 600
        - asset: assets/fonts/NotoKufiArabic-700.ttf
          weight: 700

  # NO BUNDLED FONT, matching the console's decision in _tokens.scss: font fallback is
  # per GLYPH, so Latin renders in the platform's UI face while Arabic -- which that
  # face may not cover at all -- picks the first fallback that does. Naming the
  # fallbacks explicitly is the part that matters; without it Arabic lands on
  # whatever the platform has last, which on Windows is a serif Naskh that does not
  # sit level with the Latin beside it. See lib/core/theme/khadra_theme.dart.
